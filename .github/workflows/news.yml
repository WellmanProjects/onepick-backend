name: Team news
on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes. GitHub's scheduler can run a few minutes late.
  workflow_dispatch: {}
concurrency: { group: team-news, cancel-in-progress: true }
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # optional: NEWS_FEEDS: "BBC Sport|https://...,Another|https://..."
